name: Build private companion installers

'on':
  workflow_dispatch:
  push:
    tags:
      - "private-companion-v*"

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            runner: macos-26
            suffix: macOS-arm64
            name: macOS-arm64
          - platform: macOS
            runner: macos-26-intel
            suffix: macOS-x64
            name: macOS-x64
          - platform: Windows
            runner: windows-latest
            suffix: Windows-x64
            name: Windows-x64
          - platform: Linux
            runner: ubuntu-latest
            suffix: Linux-x64
            name: Linux-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test managed Jupyter port selection
        run: node --test modelmind-source/scripts/jupyter-runtime.test.mjs
      - name: Validate and build macOS installers (PKG and DMG)
        if: matrix.platform == 'macOS'
        env:
          MODELMIND_PACKAGE_SUFFIX: ${{ matrix.suffix }}
          MODELMIND_APP_VERSION: "0.3.3"
        run: |
          bash -n scripts/start-beta-macos.command
          bash -n scripts/start-platform.sh
          python scripts/check-extension-wheel.py
          bash scripts/package-private-macos.sh
      - name: Validate and build Linux package
        if: matrix.platform == 'Linux'
        env:
          MODELMIND_PACKAGE_SUFFIX: ${{ matrix.suffix }}
          MODELMIND_APP_VERSION: "0.3.3"
        run: |
          bash -n scripts/start-beta-linux.sh
          bash -n scripts/start-platform.sh
          python scripts/check-extension-wheel.py
          bash scripts/package-private-linux.sh
      - name: Validate and build Windows installer
        if: matrix.platform == 'Windows'
        shell: pwsh
        env:
          MODELMIND_PACKAGE_SUFFIX: ${{ matrix.suffix }}
          MODELMIND_APP_VERSION: "0.3.3"
        run: |
          python scripts/check-extension-wheel.py
          $tokens = $null
          $errors = $null
          $files = @(
            "scripts/start-beta-windows.ps1",
            "scripts/start-platform.ps1",
            "scripts/package-private-windows.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              throw ($errors | Out-String)
            }
          }
          & scripts/package-private-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ModelMind-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/ModelMind-Setup-${{ matrix.suffix }}.*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish private prototype installers
    if: startsWith(github.ref, 'refs/tags/private-companion-v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: ModelMind-*
          merge-multiple: true
      - name: Create release notes
        run: |
          cat << 'EOF' > release-notes.md
          ## What's updated in 0.3.2

          - **Gemini Assistant Always Available**: The Gemini option in the Error Assistant panel is always enabled and selectable without any strikethrough or disabled state.
          - **Larger Sidebar Labels**: Right sidebar tab labels ("Error Assistant", "AI Chat", "API Key") enlarged to 14.5px bold (#334155) for clear readability.
          - **Full Linux Support**: One-line zero-prompt installer (`install-linux.sh`) and standalone Linux package with desktop launcher.
          - **Bulletproof Windows Installer**: One-line PowerShell install with zero security alerts, automatic desktop shortcut, and robust multi-release fallback.
          - **Updated Extension Wheel v0.1.5**: Packaged with all latest frontend, backend, and diagnostics fixes.

          ## ModelMind Installers & User Guide

          ### 🍎 macOS Installers
          Both **.DMG** (drag-and-drop) and **.PKG** (guided installer) formats are available:

          #### Apple Silicon (M1 / M2 / M3 / M4):
          - **DMG**: `ModelMind-Setup-macOS-arm64.dmg` — Open and drag to Applications
          - **PKG**: `ModelMind-Setup-macOS-arm64.pkg` — Double-click to run setup wizard

          #### Intel Mac:
          - **DMG**: `ModelMind-Setup-macOS-x64.dmg` — Open and drag to Applications
          - **PKG**: `ModelMind-Setup-macOS-x64.pkg` — Double-click to run setup wizard

          > **Note for macOS users**: If you see an "unidentified developer" prompt on first launch, right-click the app/package and choose **Open**, or go to **System Settings → Privacy & Security → Open Anyway**.

          #### ⚡ 1-Line Fast Install (No Gatekeeper Prompts)
          You can also install directly from Terminal without any Gatekeeper prompt:
          ```bash
          curl -fsSL https://raw.githubusercontent.com/harshitsachan830-dev/Backup2/main/scripts/install-mac.sh | bash
          ```

          ---

          ### 🪟 Windows (64-bit)
          - **EXE Download**: `ModelMind-Setup-Windows-x64.exe`
          - Double-click to install. It installs to your user profile and creates a Desktop shortcut.

          #### ⚡ 1-Line Fast Install (PowerShell — Zero Security Alerts)
          Open Windows PowerShell and run this single line (no administrator permissions required):
          ```powershell
          irm https://raw.githubusercontent.com/harshitsachan830-dev/Backup2/main/scripts/install-windows.ps1 | iex
          ```

          ---

          ### 🐧 Linux (Ubuntu, Debian, Fedora, Arch, RHEL)
          - **Standalone Archive**: `ModelMind-Setup-Linux-x64.tar.gz`

          #### ⚡ 1-Line Fast Install (Terminal)
          Open terminal and run this single line (no root permissions required):
          ```bash
          curl -fsSL https://raw.githubusercontent.com/harshitsachan830-dev/Backup2/main/scripts/install-linux.sh | bash
          ```

          ---

          ### 🚀 First Launch Setup
          1. Launch ModelMind — your default browser will open the dashboard.
          2. In the notebook, paste your Google Gemini API key into the **API Key** tab in the right sidebar.
          3. For local offline AI models, install Ollama from [ollama.com](https://ollama.com).
          EOF
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber || \
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --title "ModelMind $GITHUB_REF_NAME" \
            --notes-file release-notes.md
