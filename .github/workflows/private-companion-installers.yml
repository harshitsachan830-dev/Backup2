name: Build private companion installers

'on':
  workflow_dispatch:
  push:
    tags:
      - "private-companion-v*"

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            runner: macos-26
            suffix: macOS-arm64
            asset: ModelMind-Setup-macOS-arm64.dmg
          - platform: macOS
            runner: macos-26-intel
            suffix: macOS-x64
            asset: ModelMind-Setup-macOS-x64.dmg
          - platform: Windows
            runner: windows-latest
            suffix: Windows-x64
            asset: ModelMind-Setup-Windows-x64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test managed Jupyter port selection
        run: node --test modelmind-source/scripts/jupyter-runtime.test.mjs
      - name: Validate and build macOS DMG
        if: matrix.platform == 'macOS'
        env:
          MODELMIND_PACKAGE_SUFFIX: ${{ matrix.suffix }}
          MODELMIND_APP_VERSION: "0.2.2"
        run: |
          bash -n scripts/start-beta-macos.command
          bash -n scripts/start-platform.sh
          bash scripts/package-private-macos.sh
      - name: Validate and build Windows installer
        if: matrix.platform == 'Windows'
        shell: pwsh
        env:
          MODELMIND_PACKAGE_SUFFIX: ${{ matrix.suffix }}
          MODELMIND_APP_VERSION: "0.2.2"
        run: |
          $tokens = $null
          $errors = $null
          $files = @(
            "scripts/start-beta-windows.ps1",
            "scripts/start-platform.ps1",
            "scripts/package-private-windows.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              throw ($errors | Out-String)
            }
          }
          & scripts/package-private-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ runner.temp }}/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish private prototype installers
    if: startsWith(github.ref, 'refs/tags/private-companion-v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: ModelMind-Setup-*
          merge-multiple: true
      - name: Create release notes
        run: |
          cat << 'EOF' > release-notes.md
          ## ModelMind Install Guide

          ### macOS (DMG)
          1. Download **ModelMind-Setup-macOS-arm64.dmg** (Apple Silicon M1/M2/M3/M4) or **ModelMind-Setup-macOS-x64.dmg** (Intel).
          2. Open the `.dmg` file.
          3. **Drag ModelMind into the Applications folder**.
          4. Open Applications and double-click **ModelMind**.
          5. If macOS shows an unverified developer dialog, right-click **ModelMind -> Open** (or go to **System Settings -> Privacy & Security -> Open Anyway**).

          ### Windows
          1. Download **ModelMind-Setup-Windows-x64.exe**.
          2. Double-click to install.
          3. If SmartScreen shows a warning, click **More info -> Run anyway**.

          ### Setup
          - The dashboard opens in your browser automatically.
          - In the notebook, paste your Gemini API key in the API Key sidebar tab.
          EOF
      - name: Create private prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --title "ModelMind $GITHUB_REF_NAME" \
            --notes-file release-notes.md
