name: Build private companion installers

on:
  workflow_dispatch:
  push:
    tags:
      - "private-companion-v*"

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            runner: macos-26
            suffix: macOS-arm64
            asset: ModelMind-Setup-macOS-arm64.dmg
          - platform: macOS
            runner: macos-26-intel
            suffix: macOS-x64
            asset: ModelMind-Setup-macOS-x64.dmg
          - platform: Windows
            runner: windows-latest
            suffix: Windows-x64
            asset: ModelMind-Setup-Windows-x64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test managed Jupyter port selection
        run: node --test modelmind-source/scripts/jupyter-runtime.test.mjs
      - name: Validate and build macOS DMG
        if: matrix.platform == 'macOS'
        env:
          MODELMIND_PACKAGE_SUFFIX: ${{ matrix.suffix }}
          MODELMIND_APP_VERSION: "0.2.2"
        run: |
          bash -n scripts/start-beta-macos.command
          bash -n scripts/start-platform.sh
          bash scripts/package-private-macos.sh
      - name: Validate and build Windows installer
        if: matrix.platform == 'Windows'
        shell: pwsh
        env:
          MODELMIND_PACKAGE_SUFFIX: ${{ matrix.suffix }}
          MODELMIND_APP_VERSION: "0.2.2"
        run: |
          $tokens = $null
          $errors = $null
          $files = @(
            "scripts/start-beta-windows.ps1",
            "scripts/start-platform.ps1",
            "scripts/package-private-windows.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              throw ($errors | Out-String)
            }
          }
          & scripts/package-private-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ runner.temp }}/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish private prototype installers
    if: startsWith(github.ref, 'refs/tags/private-companion-v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: ModelMind-Setup-*
          merge-multiple: true
      - name: Create private prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --title "ModelMind $GITHUB_REF_NAME" \
            --notes "$(cat <<'EOF'
## ModelMind — Install Guide

### macOS
1. Download **ModelMind-Setup-macOS-arm64.dmg** (Apple Silicon M1/M2/M3/M4) or **ModelMind-Setup-macOS-x64.dmg** (Intel Mac).
2. Open the `.dmg` file — a window opens with the ModelMind icon and an Applications shortcut.
3. **Drag ModelMind into the Applications folder**.
4. Eject the DMG.
5. Open Launchpad or Applications and **double-click ModelMind**.
6. macOS will ask: *"ModelMind is an app downloaded from the internet. Are you sure?"* — click **Open**.
7. A Terminal window starts the local services. Keep it open while using ModelMind.

### Windows
1. Download **ModelMind-Setup-Windows-x64.exe**.
2. Double-click it to install.
3. If SmartScreen shows a warning, click **More info → Run anyway**.

### First Launch
- The ModelMind dashboard opens in your browser automatically.
- To use the AI chatbot, go to the **API Key** tab in the right sidebar and paste your Gemini API key from [aistudio.google.com](https://aistudio.google.com).
- Ollama (optional local AI) can be installed from [ollama.com](https://ollama.com).

---
*Unsigned prototype — for testing only. Do not distribute publicly.*
EOF
)"
